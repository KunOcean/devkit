# 清理已合并 PR 遗留的分支
#
# 两种触发：
#   · PR 一合并就删（pull_request_target 的 closed 事件）——走定向模式，
#     只处理刚合并那一个 PR 的 head 分支。
#   · 每周一定时全量扫描——兜底，清理漏掉的或当时因故跳过的。
#
# 必须用 pull_request_target 而不是 pull_request：来自 fork 的 PR 在
# pull_request 事件下只能拿到只读令牌，删不了任何分支。
# 本工作流**不检出 PR 的代码**（pull_request_target 下默认取 base 分支，
# 且脚本只通过 API 操作，不读工作区），因此不存在执行不可信代码的风险。
#
# 能力边界：GITHUB_TOKEN 的权限仅限本仓库，只能删**上游**的分支。fork 上
# 的分支删不了——那需要另配一个有 fork 写权限的令牌，本工作流刻意不碰。
# 同仓分支（例如 Dependabot 提 PR 用的分支）建议另外在仓库设置里开启
# 「自动删除头部分支」，那是 GitHub 原生能力，比工作流更快更省。
#
# 安全跳过规则见 .github/scripts/cleanup_branches.py。

name: 清理已合并分支

on:
  pull_request_target:
    types: [closed]
  schedule:
    # 每周一 03:00 UTC，兜底全量扫描
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印将删除的分支，不实际删除'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: 删除已合并 PR 的分支
    # 非 PR 事件一律执行；PR 事件只在「确实合并了」时执行
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 运行清理
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          # 定向模式：PR 合并后只处理这一个；定时与手动触发时为空，走全量
          PR_NUMBER: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || '' }}
        run: python3 .github/scripts/cleanup_branches.py
